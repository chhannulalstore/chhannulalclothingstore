const api=async(path,o={})=>{const r=await fetch("https://api.github.com/repos/"+GH.repo+path,{...o,cache:"no-store",headers:{Authorization:"Bearer "+GH.token,Accept:"application/vnd.github+json",...(o.body?{"Content-Type":"application/json"}:{})}});if(!r.ok){const e=new Error(r.status==401?"GitHub did not accept that token.":r.status==404?"Repository not found, or the token has no access to it.":r.status==403?"The token is not allowed to do this. It needs Contents: Read and write.":r.status==409||r.status==422?"The site was changed somewhere else. Reload this page and try again.":"GitHub error "+r.status);e.status=r.status;throw e}return r.json()};
